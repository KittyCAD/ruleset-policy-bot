name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Test workspace
        run: cargo test --workspace
        env:
          GH_TOKEN: ${{ secrets.TEST_GH_TOKEN }}
